name: CI

on:
  pull_request:
  push:
    branches: [develop]
  # The release workflow runs these checks before it builds
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run compile
      # With coverage, so the thresholds in vitest.config.mts apply
      - name: Run unit tests
        run: npm test

  # Starts real processes through node-pty's native module on each platform
  # the extension ships for, e.g. batch files through cmd.exe on Windows
  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      # node-pty installs its prebuilt or built module for Node, not Electron
      - name: Install dependencies
        run: npm ci
      - name: Run node-pty tests
        run: npm run test:pty

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      # Do not use --ignore-scripts: node-pty needs its native build for the
      # Electron runtime when integration tests launch the extension host.
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: xvfb-run -a npm run test:integration:visible

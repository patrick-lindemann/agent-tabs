name: Build and Release

on:
  push:
    branches: [main]
  # Dry runs: check and build every platform package without releasing or
  # publishing. Release pull requests get one automatically; any branch can
  # be run by hand (Actions > Build and Release > Run workflow).
  pull_request:
    branches: [main]
  workflow_dispatch:

# Releases run one at a time; a new dry run of a branch replaces the last one
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # Pull requests already run CI
  checks:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists, skipping. Bump the version in package.json to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [checks, version]
    # A dry run builds even when the version was already released
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.checks.result) &&
      (needs.version.outputs.exists == 'false' || github.event_name != 'push')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build in an older Debian so pty.node only needs glibc 2.31.
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
            container: node:22-bullseye
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: arm64
            container: node:22-bullseye
          - os: macos-latest
            target: darwin-x64
            arch: x64
          - os: macos-latest
            target: darwin-arm64
            arch: arm64
          - os: windows-2022
            target: win32-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies (skip rebuild)
        run: npm ci --ignore-scripts
      - name: Rebuild native modules for Electron
        run: npm run rebuild -- --arch ${{ matrix.arch }}
      - name: Prune native prebuilds
        run: node scripts/prune.js ${{ matrix.target }}
      - name: Package extension
        run: npm run package -- --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

  release:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la vsix-artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "vsix-artifacts/*.vsix"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  marketplace:
    needs: [version, release]
    if: github.event_name == 'push' && needs.version.outputs.exists == 'false' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install publishing tool
        run: npm ci --ignore-scripts
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true
      - name: Publish platform packages
        if: env.VSCE_PAT != ''
        shell: bash
        run: |
          shopt -s nullglob
          packages=(vsix-artifacts/*.vsix)
          if (( ${#packages[@]} == 0 )); then
            echo "No VSIX packages were downloaded" >&2
            exit 1
          fi

          pre_release=()
          if [[ "${{ contains(needs.version.outputs.tag, '-') }}" == "true" ]]; then
            pre_release+=(--pre-release)
          fi
          for package in "${packages[@]}"; do
            echo "Publishing $package"
            npm run publish:marketplace -- --packagePath "$package" "${pre_release[@]}"
          done
      - name: Skip publishing without VSCE_PAT
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set; skipping VS Code Marketplace publishing."

name: Build and Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already exists, skipping. Bump the version in package.json to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build in an older Debian so pty.node only needs glibc 2.31.
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
            container: node:22-bullseye
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: arm64
            container: node:22-bullseye
          - os: macos-latest
            target: darwin-x64
            arch: x64
          - os: macos-latest
            target: darwin-arm64
            arch: arm64
          - os: windows-2022
            target: win32-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies (skip rebuild)
        run: npm ci --ignore-scripts
      - name: Rebuild native modules for Electron
        run: npm run rebuild -- --arch ${{ matrix.arch }}
      - name: Package extension
        run: npm run package -- --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la vsix-artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "vsix-artifacts/*.vsix"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  marketplace:
    needs: [version, release]
    if: needs.version.outputs.exists == 'false' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install publishing tool
        run: npm ci --ignore-scripts
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true
      - name: Publish platform packages
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          args=(--packagePath vsix-artifacts/*.vsix)
          if [[ "${{ contains(needs.version.outputs.tag, '-') }}" == "true" ]]; then
            args+=(--pre-release)
          fi
          npm run publish:marketplace -- "${args[@]}"
      - name: Skip publishing without VSCE_PAT
        if: env.VSCE_PAT == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: echo "::notice::VSCE_PAT is not set; skipping VS Code Marketplace publishing."
